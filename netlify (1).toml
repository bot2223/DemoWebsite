[build]
  command = "bun run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# SPA fallback so client routes resolve to index.html in production.
[[redirects]]
  from = "/api/airtable-leads"
  to   = "/.netlify/functions/airtable-leads"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
